services:
  - type: web
    name: miui-chat
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      # 三个机器人全部走 DeepSeek（免费额度），只需填这一个 key
      - key: DEEPSEEK_KEY
        sync: false
        # 到 https://platform.deepseek.com 注册即可领取免费额度，把 key 填这里
      - key: DEEPSEEK_BASE
        value: https://api.deepseek.com/v1
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
